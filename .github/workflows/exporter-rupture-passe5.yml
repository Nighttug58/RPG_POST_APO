name: Export RUPTURE passe 5
on:
  push:
    branches: [main]
    paths:
      - 'Livre/outils/exporter_passe5.py'
      - 'Livre/editions/passe5/*.md'
      - '.github/workflows/exporter-rupture-passe5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-ebgaramond
          python -m pip install --disable-pip-version-check python-docx
      - name: Produire le Word
        run: python Livre/outils/exporter_passe5.py
      - name: Produire le PDF
        run: |
          libreoffice -env:UserInstallation=file:///tmp/lo-v5 --headless --convert-to pdf --outdir Livre/editions/passe5 Livre/editions/passe5/RUPTURE_edition_revisee_passe5.docx
          test -s Livre/editions/passe5/RUPTURE_edition_revisee_passe5.docx
          test -s Livre/editions/passe5/RUPTURE_edition_revisee_passe5.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: RUPTURE-27-chapitres-passe5
          path: |
            Livre/editions/passe5/RUPTURE_edition_revisee_passe5.docx
            Livre/editions/passe5/RUPTURE_edition_revisee_passe5.pdf
            Livre/editions/passe5/controle_passe5.json
          if-no-files-found: error
      - name: Archiver les exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Livre/editions/passe5/RUPTURE_edition_revisee_passe5.docx Livre/editions/passe5/RUPTURE_edition_revisee_passe5.pdf Livre/editions/passe5/controle_passe5.json
          if ! git diff --cached --quiet; then
            git commit -m "build(livre): export Word PDF de l'édition révisée [skip ci]"
            git push
          fi
