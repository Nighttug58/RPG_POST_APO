name: Validation des sauvegardes RPG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validation de l'etat du jeu
        run: python3 scripts/valider_sauvegarde.py
      - name: Verification syntaxique du visualiseur
        run: node --check docs/dashboard.js
